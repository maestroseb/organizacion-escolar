<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Condensed:wght@400;600;700&display=swap">
<style>
  /* ============================================================
     Sistema de diseño único (claro/oscuro), compacto.
     - Inter para texto de interfaz; Roboto Condensed para datos
       densos (tablas, sábana, horario, etiquetas, badges).
     - Tokens en :root, redefinidos para oscuro por
       prefers-color-scheme y por override [data-theme].
     ============================================================ */
  :root {
    /* Tipografía */
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-cond: "Roboto Condensed", "Arial Narrow", "Inter", system-ui, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --fs-xs: 11px; --fs-sm: 12px; --fs-data: 13px; --fs: 13.5px; --fs-md: 14.5px; --fs-lg: 17px;

    /* Espaciado (escala 4px) */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px;
    --gap: 12px;

    /* Radios */
    --radius: 10px; --radius-sm: 7px; --radius-xs: 5px; --radius-pill: 999px;

    /* Alturas de control */
    --ctl-h: 32px; --ctl-h-sm: 26px;

    /* Color */
    --bg: #f4f5f8;
    --surface: #ffffff;
    --surface-2: #f9fafb;
    --surface-3: #eef0f4;
    --border: #e3e5eb;
    --border-strong: #cfd3dc;
    --text: #171a23;
    --muted: #4f5566;
    --faint: #6b7182;
    --accent: #4f46e5;
    --accent-weak: #eceafe;
    --accent-text: #4338ca;
    --ok: #15803d;      --ok-weak: #e6f5eb;
    --warn: #a4490a;    --warn-weak: #fdf1e3;
    --danger: #c42b2b;  --danger-weak: #fdeaea;
    --purple: #7e22ce;  --purple-weak: #f3e8ff;
    --on-accent: #ffffff; --on-danger: #ffffff;
    --band: #4f9d84;    --recreo: #3a3d47;
    --focus: color-mix(in srgb, var(--accent) 45%, transparent);
    --shadow-sm: 0 1px 2px rgba(16,20,34,.06);
    --shadow: 0 1px 2px rgba(16,20,34,.05), 0 4px 14px rgba(16,20,34,.06);
    --shadow-lg: 0 12px 40px rgba(16,20,34,.18);
    --ease: cubic-bezier(.2,.7,.3,1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1016; --surface: #171a22; --surface-2: #1b1f28; --surface-3: #242935;
      --border: #2a2f3b; --border-strong: #3b4150;
      --text: #e9ebf1; --muted: #b0b5c2; --faint: #8d93a3;
      --accent: #818cf8; --accent-weak: #232650; --accent-text: #b4bcff;
      --ok: #4ade80; --ok-weak: #11291b;
      --warn: #fbb35c; --warn-weak: #32230f;
      --danger: #ff7a70; --danger-weak: #371a1b;
      --purple: #d0a6ff; --purple-weak: #2c1b41;
      --recreo: #4a4f5c; --on-accent: #0e1016; --on-danger: #0e1016;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.4);
      --shadow-lg: 0 16px 50px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1016; --surface: #171a22; --surface-2: #1b1f28; --surface-3: #242935;
    --border: #2a2f3b; --border-strong: #3b4150;
    --text: #e9ebf1; --muted: #b0b5c2; --faint: #8d93a3;
    --accent: #818cf8; --accent-weak: #232650; --accent-text: #b4bcff;
    --ok: #4ade80; --ok-weak: #11291b;
    --warn: #fbb35c; --warn-weak: #32230f;
    --danger: #ff7a70; --danger-weak: #371a1b;
    --purple: #d0a6ff; --purple-weak: #2c1b41;
    --recreo: #4a4f5c; --on-accent: #0e1016; --on-danger: #0e1016;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.4);
    --shadow-lg: 0 16px 50px rgba(0,0,0,.6);
    color-scheme: dark;
  }

  /* ---------- Base ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font); font-size: var(--fs); color: var(--text);
    line-height: 1.45; -webkit-font-smoothing: antialiased; overflow-x: hidden;
    font-feature-settings: "cv11", "ss01";
  }
  h1, h2, h3, h4 { letter-spacing: -0.015em; line-height: 1.25; }
  a { color: var(--accent-text); }
  code { font-family: var(--font-mono); font-size: .92em; background: var(--surface-3); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
  ::selection { background: var(--accent-weak); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  /* ---------- Barra superior: marca · pestañas · tema en una fila ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--surface) 90%, transparent);
    backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner {
    max-width: 1440px; margin: 0 auto; padding: 0 var(--s4);
    display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr) auto;
    grid-template-areas: "brand tabs tema"; align-items: center; column-gap: var(--s4);
  }
  .brandrow { display: contents; }
  .brand { grid-area: brand; display: flex; align-items: center; gap: 10px; min-width: 0; max-width: 300px; padding: 8px 0; }
  #btn-tema { grid-area: tema; }
  .brand .logo {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), #0ea5a4);
    display: grid; place-items: center; box-shadow: var(--shadow-sm);
  }
  .brand .logo svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2; }
  .brand .titles { min-width: 0; }
  .brand h1 { font-size: 14px; font-weight: 650; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand .sub { font-family: var(--font-cond); font-size: var(--fs-sm); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }

  .tabs {
    grid-area: tabs; display: flex; gap: 2px; overflow-x: auto; align-self: stretch;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    appearance: none; border: none; background: none; cursor: pointer; border-radius: 0;
    font: inherit; font-size: var(--fs); color: var(--muted); font-weight: 550;
    padding: 0 12px; min-height: 48px; white-space: nowrap;
    box-shadow: inset 0 -2px 0 transparent;
    display: inline-flex; align-items: center; gap: 6px; transition: color .15s, box-shadow .15s;
  }
  .tab:hover:not(:disabled) { color: var(--text); box-shadow: inset 0 -2px 0 var(--border-strong); }
  .tab.active { color: var(--accent-text); box-shadow: inset 0 -2px 0 var(--accent); }
  .tab:focus-visible { outline-offset: -4px; }
  .tab:disabled { color: var(--faint); cursor: not-allowed; opacity: .75; }
  .tab .soon {
    font-family: var(--font-cond); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    color: var(--faint); border: 1px solid var(--border); border-radius: var(--radius-pill); padding: 0 5px;
  }
  .tab .pill, .subtab .pill {
    font-family: var(--font-cond); font-size: var(--fs-xs); font-weight: 600; min-width: 18px; text-align: center;
    background: var(--surface-3); color: var(--muted); border-radius: var(--radius-pill); padding: 0 6px; line-height: 16px;
    font-variant-numeric: tabular-nums;
  }
  .tab.active .pill, .subtab.active .pill { background: var(--accent-weak); color: var(--accent-text); }

  @media (max-width: 720px) {
    .topbar-inner { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "brand tema" "tabs tabs"; padding: 0 var(--s3); }
    .brand { max-width: none; padding: 6px 0 2px; }
    .tab { min-height: 40px; padding: 0 10px; }
  }

  /* ---------- Submenú de Configuración ---------- */
  .subtabs {
    display: flex; gap: 2px; flex-wrap: nowrap; overflow-x: auto; margin: 0 0 var(--s4);
    padding: 3px; background: var(--surface-3); border-radius: var(--radius);
    scrollbar-width: none; width: max-content; max-width: 100%;
  }
  .subtabs::-webkit-scrollbar { display: none; }
  .subtab {
    appearance: none; border: none; background: transparent; cursor: pointer; font: inherit; flex-shrink: 0;
    font-size: var(--fs); font-weight: 550; color: var(--muted); padding: 5px 11px; border-radius: var(--radius-sm);
    display: inline-flex; align-items: center; gap: 6px; transition: background .15s, color .15s; white-space: nowrap;
  }
  .subtab:hover { color: var(--text); background: color-mix(in srgb, var(--surface) 60%, transparent); }
  .subtab.active { background: var(--surface); color: var(--accent-text); box-shadow: var(--shadow-sm); }

  /* ---------- Contenedor de contenido ---------- */
  .shell { max-width: 1440px; margin: 0 auto; padding: var(--s5) var(--s4) 56px; }
  .view { display: none; animation: fade .16s var(--ease); min-width: 0; }
  .view.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  .page-head { margin-bottom: var(--s4); }
  .page-head h2 { font-size: clamp(18px, 2vw, 21px); font-weight: 650; margin: 0; }
  .page-head p { color: var(--muted); margin: 4px 0 0; font-size: var(--fs); max-width: 90ch; }

  .section-label {
    font-family: var(--font-cond); font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: .07em;
    color: var(--faint); font-weight: 700; margin: var(--s6) 0 var(--s2);
  }

  /* ---------- Botones ---------- */
  button, .btn-like {
    appearance: none; font: inherit; font-size: var(--fs); font-weight: 600; cursor: pointer;
    border-radius: var(--radius-sm); padding: 0 14px; min-height: var(--ctl-h); border: 1px solid transparent; line-height: 1.15;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
    transition: background .15s, border-color .15s, color .15s, transform .05s;
  }
  button:active:not(:disabled), .btn-like:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-sm); }
  button.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 86%, #000); }
  button.secondary, .btn-like { background: var(--surface); color: var(--text); border-color: var(--border-strong); text-decoration: none; margin: 0; }
  button.secondary:hover:not(:disabled), .btn-like:hover { background: var(--surface-3); }
  button.danger { background: var(--danger); color: var(--on-danger); }
  button.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 86%, #000); }
  button.ghost { background: transparent; color: var(--muted); padding: 0 8px; min-height: 30px; }
  button.ghost:hover:not(:disabled) { background: var(--surface-3); color: var(--text); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-icon {
    background: transparent; border: none; color: var(--faint); padding: 0 6px; min-height: 24px;
    font-size: 16px; line-height: 1; border-radius: var(--radius-xs); cursor: pointer;
  }
  .btn-icon:hover { color: var(--danger); background: var(--danger-weak); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: var(--s4); }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 10px; }
  .toolbar > * { max-width: 100%; }

  /* Vistas en dos columnas (Grupos+Localizaciones, Materias+Cargos) */
  .two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s5); align-items: start; }
  .col-sec { min-width: 0; }
  .col-sec .col-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .col-sec .col-head h3 { margin: 0; font-size: var(--fs-md); font-weight: 650; }
  .col-sec .col-head .toolbar { margin: 0; }
  @media (max-width: 960px) { .two-col { grid-template-columns: minmax(0, 1fr); gap: var(--s6); } }

  /* ---------- Formularios ---------- */
  .panelbox { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--s4); box-shadow: var(--shadow-sm); min-width: 0; }
  .form { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 12px 16px; }
  .form .full { grid-column: 1 / -1; }
  label { display: block; font-size: var(--fs-sm); color: var(--muted); margin-bottom: 4px; font-weight: 550; }
  input[type=text], input[type=date], input[type=email], input[type=number], input[type=search], select, textarea {
    width: 100%; max-width: 100%; padding: 0 9px; min-height: var(--ctl-h); font-size: var(--fs); font-family: inherit;
    color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  select { padding-right: 4px; text-overflow: ellipsis; }
  textarea { min-height: 140px; padding: 8px 10px; resize: vertical; font-family: var(--font-mono); font-size: 12px; line-height: 1.5; }
  input:hover, select:hover, textarea:hover { border-color: color-mix(in srgb, var(--border-strong) 60%, var(--text)); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
  input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  .req { color: var(--danger); }
  fieldset { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin: 0; min-width: 0; }
  legend { padding: 0 4px; color: var(--muted); font-size: var(--fs-sm); font-weight: 550; }
  .radio-row, .check-row { display: flex; gap: 6px 16px; flex-wrap: wrap; margin-top: 4px; }
  .radio-row label, .check-row label { display: flex; align-items: center; gap: 6px; margin: 0; color: var(--text); font-size: var(--fs); font-weight: 400; cursor: pointer; }
  .hint { font-size: var(--fs-sm); color: var(--muted); }

  /* ---------- Tablas editables (hoja compacta) ---------- */
  .tablewrap {
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
    overflow: auto; max-height: min(72vh, 900px); overscroll-behavior-x: contain;
  }
  table.data { width: 100%; min-width: 480px; border-collapse: separate; border-spacing: 0; font-size: var(--fs-data); font-variant-numeric: tabular-nums; }
  table.data th {
    position: sticky; top: 0; z-index: 2; text-align: left; white-space: nowrap;
    font-family: var(--font-cond); font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); font-weight: 600; padding: 7px 8px; background: var(--surface-2); border-bottom: 1px solid var(--border);
  }
  table.data td { padding: 2px 4px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.data tbody tr:last-child td { border-bottom: none; }
  table.data tbody tr { transition: background .1s; }
  table.data tbody tr:hover { background: var(--surface-2); }
  /* Inputs "de celda": sin borde hasta hover/focus → aspecto de hoja de cálculo. */
  table.data input[type=text], table.data input[type=email], table.data input[type=number], table.data input[type=date], table.data select {
    min-height: 28px; padding: 0 6px; font-size: var(--fs-data); border-color: transparent; background: transparent; border-radius: var(--radius-xs);
  }
  table.data input:hover, table.data select:hover { border-color: var(--border-strong); background: var(--surface); }
  table.data input:focus, table.data select:focus { border-color: var(--accent); background: var(--surface); }
  .col-num { width: 44px; text-align: center; color: var(--faint); font-family: var(--font-cond); white-space: nowrap; }
  .col-center { text-align: center; }
  /* Tablas ajustadas al contenido: cada columna mide lo que dice su <th>. */
  table.data.fit { width: auto; min-width: 0; }
  .tablewrap:has(> table.data.fit) { width: fit-content; max-width: 100%; }
  table.data.fit td input[type=text], table.data.fit td input[type=email] { min-width: 0; width: 100%; }
  table.data.fit .col-acc { width: 32px; }
  .centro-cols { grid-template-columns: minmax(0, 1fr) auto; }
  @media (max-width: 960px) { .centro-cols { grid-template-columns: minmax(0, 1fr); } }
  .centro-cols .form { grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 8px 12px; }
  .col-acc { width: 72px; text-align: center; white-space: nowrap; }
  table.data th.col-num, table.data th.col-center, table.data th.col-acc { text-align: center; }
  /* Arrastrar filas */
  table.data tr.dragging { opacity: .5; }
  table.data tr.drop-target td { box-shadow: inset 0 2px 0 var(--accent); }
  .drag { cursor: grab; color: var(--faint); user-select: none; }
  .drag:active { cursor: grabbing; }
  /* Selector de color */
  .colorpick { display: inline-flex; align-items: center; gap: 2px; }
  .colorpick input[type=color] { width: 22px; height: 22px; padding: 0; border: 1px solid var(--border-strong); border-radius: 6px; background: none; cursor: pointer; }
  .colorpick input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  .colorpick input[type=color]::-webkit-color-swatch { border: none; border-radius: 4px; }
  .colorclear { appearance: none; border: none; background: transparent; color: var(--faint); cursor: pointer; font-size: 13px; line-height: 1; padding: 0 2px; min-height: 0; }
  .colorclear:hover { color: var(--danger); }
  .colorclear.is-empty { visibility: hidden; }

  /* ---------- Badges / resultados ---------- */
  .badge {
    display: inline-block; padding: 1px 7px; border-radius: var(--radius-pill); white-space: nowrap;
    font-family: var(--font-cond); font-size: var(--fs-xs); font-weight: 600; letter-spacing: .02em; line-height: 16px;
  }
  .badge.ok { background: var(--ok-weak); color: var(--ok); }
  .badge.omitir { background: var(--surface-3); color: var(--muted); }
  .badge.dudoso, .badge.revisar, .badge.incompleto { background: var(--warn-weak); color: var(--warn); }
  .badge.conflicto, .badge.vacio { background: var(--danger-weak); color: var(--danger); }
  .result { margin-top: var(--s3); padding: 9px 12px; border-radius: var(--radius-sm); font-size: var(--fs); border: 1px solid; overflow-wrap: anywhere; }
  .result.ok { background: var(--ok-weak); border-color: color-mix(in srgb, var(--ok) 35%, transparent); color: var(--ok); }
  .result.err { background: var(--danger-weak); border-color: color-mix(in srgb, var(--danger) 35%, transparent); color: var(--danger); }
  .result.info { background: var(--accent-weak); border-color: color-mix(in srgb, var(--accent) 28%, transparent); color: var(--accent-text); }

  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Estado vacío */
  .empty { text-align: center; color: var(--muted); padding: 28px 16px; border: 1px dashed var(--border-strong); border-radius: var(--radius); background: var(--surface-2); }

  /* ---------- Modal ---------- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(8,10,18,.55); display: none; align-items: center; justify-content: center; z-index: 1000; padding: var(--s4); backdrop-filter: blur(2px); }
  .modal-overlay.show { display: flex; animation: fade .15s; }
  .modal-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: var(--s5);
    max-width: 440px; width: 100%; max-height: calc(100vh - 32px); overflow: auto; box-shadow: var(--shadow-lg);
  }
  .modal-box h3 { margin: 0 0 6px; font-size: var(--fs-lg); }
  .modal-box p { margin: 0 0 var(--s4); font-size: var(--fs); color: var(--muted); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .modal-wide { max-width: 680px; }

  /* ---------- Séneca / catálogo detectado ---------- */
  .seneca-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 8px; margin-top: 10px; }
  .seneca-card {
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; background: var(--surface);
    display: flex; gap: 10px; align-items: flex-start; cursor: pointer; min-width: 0; margin: 0; color: var(--text); font-weight: 400;
    transition: border-color .15s, background .15s;
  }
  .seneca-card:hover { border-color: var(--border-strong); }
  .seneca-card.activa { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); background: var(--accent-weak); }
  .seneca-card.vacia { opacity: .6; }
  .seneca-card input { margin-top: 2px; flex-shrink: 0; }
  .seneca-card .body { min-width: 0; }
  .seneca-card .titulo { font-weight: 600; font-size: var(--fs); }

    display: inline-block; margin-left: 6px; background: var(--accent); color: var(--on-accent); font-family: var(--font-cond);

<div class="page-head">
  <h2>Sábana</h2>
  <p>Todos los docentes colocados en cada tramo, para localizarlos de un vistazo. Cada tramo muestra las aulas (con su docente) y, a la derecha, los apoyos y cargos numerados por prioridad de sustitución.</p>
</div>

<div class="sb-toolbar">
  <div class="segmented" id="sb-sem"></div>
  <span class="sb-grow"></span>
  <button type="button" class="secondary" onclick="sbImprimir()" title="Imprimir o guardar como PDF (apaisado)">Imprimir / PDF</button>
  <button type="button" class="secondary" id="sb-btn-png" onclick="sbPng()" title="Descargar la sábana completa como imagen PNG">PNG</button>
</div>

<div id="sb-body"></div>

<script>
  // Semana alterna mostrada (A/B). null = la actual, la decide el servidor.
  var SB_SEM = null, SB_SEM_ACTUAL = null;

  function renderSabana() { _cargarSemana(); }
  function setSbSemana(s) { SB_SEM = s; _cargarSemana(); }
  function _pintarSemToggle() {
    document.getElementById('sb-sem').innerHTML = ['A', 'B'].map(function(k) {
      return '<button type="button" class="' + (k === SB_SEM ? 'active' : '') + '" onclick="setSbSemana(\'' + k + '\')">Semana ' + k +
        (k === SB_SEM_ACTUAL ? ' <span class="sb-actual">actual</span>' : '') + '</button>';
    }).join('');
  }

  // Caché por semana válida mientras DATOS_VERSION no cambie. `_sbSeq`
  // descarta respuestas que llegan tarde (clics rápidos).
  var _sbCache = {}, _sbCacheVersion = -1, _sbSeq = 0;
  function _cargarSemana() {
    const cont = document.getElementById('sb-body');
    if (_sbCacheVersion !== DATOS_VERSION) { _sbCache = {}; _sbCacheVersion = DATOS_VERSION; }
    const seq = ++_sbSeq, version = DATOS_VERSION, sem = SB_SEM;
    const ok = function(res) {
      if (res && res.semana && version === DATOS_VERSION) _sbCache[res.semana] = res;
      if (seq === _sbSeq) _pintarSemana(res);
    };
    const ko = function(err) { if (seq === _sbSeq) cont.innerHTML = _errHtml(err); };
    if (sem && _sbCache[sem]) { _pintarSemana(_sbCache[sem]); return; }
    // Arranque: la sábana de la semana actual ya viene pedida en paralelo.
    if (!sem && _consumirPrefetch('sabanaSemana', function(err, res) { if (err) ko(err); else ok(res); })) return;
    cont.innerHTML = '<p class="hint"><span class="spinner"></span> Cargando…</p>';
    google.script.run.withSuccessHandler(ok).withFailureHandler(ko).sabanaSemana(sem || '');
  }

  // ---------- Modo semana completa ----------
  function _pintarSemana(res) {
    const cont = document.getElementById('sb-body');
    if (res && res.semana) { SB_SEM = res.semana; SB_SEM_ACTUAL = res.semanaActual; _pintarSemToggle(); }
    if (!res || !res.hayTramos) { cont.innerHTML = '<div class="empty">Aún no hay tramos horarios. Configúralos en <b>Configuración → Tramos</b>.</div>'; return; }
    cont.innerHTML = res.tramos.map(function(t){
      if (t.tramo.es_recreo) return _sbRecreo(t.tramo);
      var col = _sbColor(t.tramo.color) || '#4f9d84', st = _sbHeadStyle(col);
      var cols = res.dias.map(function(d){
        var cell = t.porDia[d.k] || { cursos: [], apoyos: [], libres: [] };
        return '<div class="sb-daycol">' +
          '<div class="sb-dayhead" style="' + st + '">' + _esc(_sbTitulo(d.n, t.tramo)) + '</div>' +
          _sbCols(cell.cursos, cell.apoyos) +
          _sbLibres(cell.libres) +
        '</div>';
      }).join('');
      return '<div class="sb-weekrow sb-tramo-w">' +
          '<div class="sb-rail" style="' + st + '">TRAMO ' + _esc(t.tramo.orden) + '</div>' + cols +
        '</div>';
    }).join('');
    cont.innerHTML = '<div class="sb-weekscroll" style="' + _sbAnchos(res) + '">' + cont.innerHTML + '</div>';
  }

  // Columnas Curso y Docente apenas más anchas que el nombre más largo (en ch de la
  // fuente condensada); Ocup. según el texto más largo, con tope.
  function _sbAnchos(res) {
    var doc = 4, oc = 4, cu = 3;
    res.tramos.forEach(function(t) {
      if (t.tramo.es_recreo) return;
      Object.keys(t.porDia).forEach(function(k) {
        var c = t.porDia[k];
        c.cursos.forEach(function(g) { cu = Math.max(cu, String(g.grupo.nombre || '').length); (g.ocupantes || []).forEach(function(o) {
          doc = Math.max(doc, String(o.docente || '').length);
          oc = Math.max(oc, String(o.materia || '').length);
        }); });
        c.apoyos.forEach(function(a) {
          doc = Math.max(doc, String(a.docente || '').length);
          oc = Math.max(oc, String(a.rol || '').length + (a.destino && a.destino.length ? a.destino.join(' / ').length + 1 : 0));
        });
      });
    });
    return '--sb-cw:calc(' + cu + 'ch + 12px);--sb-docw:calc(' + doc + 'ch + 14px);--sb-ocw:calc(' + Math.min(oc, 14) + 'ch + 18px);';
  }

  // ---------- Exportar: PDF (impresión apaisada) y PNG ----------
  function _sbGrid() { return document.querySelector('#sb-body .sb-weekscroll'); }
  function sbImprimir() {
    var g = _sbGrid(); if (!g) return;
    // Ajusta al ancho útil de un A4 apaisado (≈ 1080 px) para que quepa la semana.
    var z = Math.min(1, 1080 / g.scrollWidth);
    document.documentElement.style.setProperty('--sb-print-zoom', z);
    document.body.classList.add('print-sabana');
    var fin = function() { document.body.classList.remove('print-sabana'); window.removeEventListener('afterprint', fin); };
    window.addEventListener('afterprint', fin);
    setTimeout(function() { window.print(); setTimeout(fin, 1000); }, 50);
  }
  var _h2cEspera = null;
  function _cargarH2c(cb) {
    if (window.html2canvas) return cb();
    if (_h2cEspera) { _h2cEspera.push(cb); return; }
    _h2cEspera = [cb];
    var sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    sc.onload = function() { var l = _h2cEspera; _h2cEspera = null; l.forEach(function(f) { f(); }); };
    sc.onerror = function() { _h2cEspera = null; _sbPngFin(); alert('No se pudo cargar el generador de imágenes.'); };
    document.head.appendChild(sc);
  }
  function _sbPngFin() { var b = document.getElementById('sb-btn-png'); b.disabled = false; b.textContent = 'PNG'; }
  function sbPng() {
    var g = _sbGrid(); if (!g) return;
    var btn = document.getElementById('sb-btn-png'); btn.disabled = true; btn.textContent = 'Generando…';
    _cargarH2c(function() {
      // Copia sin recorte de scroll para capturar la sábana completa.
      var copia = g.cloneNode(true);
      copia.classList.add('sb-export');
      var host = document.createElement('div');
      host.style.cssText = 'position:fixed;left:-100000px;top:0;';
      host.appendChild(copia); document.getElementById('sb-body').appendChild(host);
      var bg = getComputedStyle(document.body).backgroundColor;
      html2canvas(copia, { scale: 2, backgroundColor: bg, windowWidth: copia.scrollWidth + 40 })
        .then(function(canvas) {
          var a = document.createElement('a');
          a.download = 'sabana-semana-' + (SB_SEM || '') + '.png';
          a.href = canvas.toDataURL('image/png');
          document.body.appendChild(a); a.click(); a.remove();
        })
        .catch(function(e) { alert('No se pudo generar la imagen: ' + ((e && e.message) || e)); })
        .then(function() { host.remove(); _sbPngFin(); });
    });
  }

  // ---------- Piezas compartidas ----------
  function _sbTitulo(dia, tr) {
    return String(dia || '').toUpperCase() + ' - TRAMO ' + tr.orden + (tr.horas ? (' - ' + tr.horas) : '');
  }
  function _sbRecreo(tr) {
    return '<div class="sb-recreo">RECREO' + (tr.horas ? (' · ' + _esc(tr.horas)) : '') + '</div>';
  }
  function _sbCols(cursos, apoyos) {
    return '<div class="sb-cols">' +
      '<div class="sb-pane">' + _sbTablaCursos(cursos) + '</div>' +
      '<div class="sb-pane">' + _sbTablaApoyos(apoyos) + '</div>' +
    '</div>';
  }
  var _SB_COLS = '<colgroup><col class="c1"><col class="c2"><col class="c3"></colgroup>';
  function _sbTablaCursos(cursos) {
    var rows = cursos.map(function(c){
      var curso = _esc(c.grupo.nombre);
      if (c.vacio || !c.ocupantes.length) return '<tr><td class="sb-curso">' + curso + '</td><td colspan="2"><span class="sb-sin">sin cubrir</span></td></tr>';
      var n = c.ocupantes.length;
      return c.ocupantes.map(function(o, i){
        var mat = o.materia ? ('<span class="sb-pill" style="' + _sbPill(o.color) + '" title="' + _esc(o.materia) + '">' + _esc(o.materia) + '</span>')
                            : (o.tutor ? '<span class="sb-tutor">tutoría</span>' : '');
        return '<tr' + (i ? ' class="sb-cont"' : '') + '>' +
          (i ? '' : '<td class="sb-curso"' + (n > 1 ? ' rowspan="' + n + '"' : '') + '>' + curso + '</td>') +
          '<td class="sb-doc">' + _esc(o.docente || '—') + '</td><td class="sb-oc">' + mat + '</td></tr>';
      }).join('');
    }).join('');
    return '<table class="sb">' + _SB_COLS + '<thead><tr><th>Curso</th><th>Docente</th><th>Ocup.</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }
  function _sbTablaApoyos(apoyos) {
    var rows = apoyos.map(function(a){
      var dest = (a.destino && a.destino.length) ? (' ' + _esc(a.destino.join(' / '))) : '';
      return '<tr><td class="sb-loc">#' + _esc(('0' + a.loc).slice(-2)) + '</td>' +
        '<td class="sb-doc">' + _esc(a.docente) + '</td>' +
        '<td class="sb-oc"><span class="sb-pill" style="' + _sbPill(a.color) + '" title="' + _esc(a.rolLargo || a.rol) + '">' + _esc(a.rol) + dest + '</span></td></tr>';
    }).join('') || '<tr><td colspan="3" style="padding:8px;color:var(--faint)">—</td></tr>';
    return '<table class="sb">' + _SB_COLS + '<thead><tr><th>Loc</th><th>Docente</th><th>Ocup.</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }
  function _sbLibres(libres) {
    return libres && libres.length ? ('<div class="sb-libres"><b>Libres (' + libres.length + '):</b> ' + libres.map(_esc).join(' · ') + '</div>') : '';
  }

  // Solo colores hex válidos llegan a un atributo style (vienen de la hoja).
  function _sbColor(c) { return /^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(String(c || '')) ? c : ''; }
  function _sbHeadStyle(col) { return 'background:' + col + ';color:' + _sbTxt(col) + ';'; }
  function _sbPill(hex) { hex = _sbColor(hex); if (!hex) return 'background:var(--surface-3);color:var(--text);'; return 'background:' + hex + ';color:' + _sbTxt(hex) + ';'; }
  function _sbTxt(hex) {
    var c = String(hex || '').replace('#',''); if (c.length < 6) return '#1f2430';
    var r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    return ((0.299*r + 0.587*g + 0.114*b) / 255) > 0.62 ? '#1f2430' : '#ffffff';
  }
</script>

<div class="page-head">
  <h2>Sábana</h2>
  <p>Todos los docentes colocados en cada tramo, para localizarlos de un vistazo. Elige el día; cada tramo muestra las aulas (con su docente) y, a la derecha, los apoyos y cargos numerados por prioridad de sustitución.</p>
</div>

<div class="sb-toolbar">
  <div class="segmented" id="sb-dias">
    <button type="button" data-d="L" class="active" onclick="setSbDia('L')">Lunes</button>
    <button type="button" data-d="M" onclick="setSbDia('M')">Martes</button>
    <button type="button" data-d="X" onclick="setSbDia('X')">Miércoles</button>
    <button type="button" data-d="J" onclick="setSbDia('J')">Jueves</button>
    <button type="button" data-d="V" onclick="setSbDia('V')">Viernes</button>
  </div>
</div>

<div id="sb-body"></div>

<script>
  var SB_DIA = 'L';

  function renderSabana() {
    const cont = document.getElementById('sb-body');
    cont.innerHTML = '<p class="hint"><span class="spinner"></span> Cargando…</p>';
    google.script.run
      .withSuccessHandler(_pintarSabana)
      .withFailureHandler(function(err){ cont.innerHTML = '<div class="result err">✗ ' + (err.message || err) + '</div>'; })
      .sabanaDia(SB_DIA);
  }
  function setSbDia(d) {
    SB_DIA = d;
    document.querySelectorAll('#sb-dias button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-d') === d); });
    renderSabana();
  }

  function _pintarSabana(res) {
    const cont = document.getElementById('sb-body');
    if (!res || !res.hayTramos) {
      cont.innerHTML = '<div class="empty">Aún no hay tramos horarios. Configúralos en <b>Configuración → Tramos</b>.</div>';
      return;
    }
    cont.innerHTML = res.tramos.map(function(t){ return _sbBloque(res, t); }).join('');
  }

  function _sbBloque(res, t) {
    const tr = t.tramo;
    const etq = tr.es_recreo ? 'RECREO' : ('TRAMO ' + tr.orden);
    const titulo = res.diaLargo.toUpperCase() + ' · ' + etq + ' · ' + tr.horas;

    var left = t.cursos.map(function(c){
      var oc;
      if (c.vacio) {
        oc = '<span class="sb-sin">sin cubrir</span>';
      } else {
        oc = c.ocupantes.map(function(o){
          var mat = '';
          if (o.materia) mat = '<span class="sb-ocup" style="' + _sbTint(o.color) + '">' + _esc(o.materia) + '</span>';
          else if (o.tutor) mat = '<span class="sb-tutor">tutoría</span>';
          return '<div class="sb-line"><span class="sb-doc">' + _esc(o.docente || '—') + '</span> ' + mat + '</div>';
        }).join('');
      }
      return '<tr><td class="sb-curso">' + _esc(c.grupo.nombre) + '</td><td>' + oc + '</td></tr>';
    }).join('');

    var right = t.apoyos.map(function(a){
      var dest = (a.destino && a.destino.length) ? (' ' + _esc(a.destino.join(' / '))) : '';
      return '<tr><td class="sb-loc">#' + ('0' + a.loc).slice(-2) + '</td>' +
        '<td class="sb-doc">' + _esc(a.docente) + '</td>' +
        '<td><span class="sb-pill" style="' + _sbPill(a.color) + '" title="' + _esc(a.rolLargo || a.rol) + '">' + _esc(a.rol) + dest + '</span></td></tr>';
    }).join('') || '<tr><td colspan="3" style="padding:10px;color:var(--faint)">—</td></tr>';

    var libres = t.libres.length ? ('<div class="sb-libres"><b>Libres (' + t.libres.length + '):</b> ' + t.libres.map(_esc).join(' · ') + '</div>') : '';

    return '<div class="sb-tramo' + (tr.es_recreo ? ' recreo' : '') + '">' +
      '<div class="sb-head">' + _esc(titulo) + '</div>' +
      '<div class="sb-bodyrow">' +
        '<div class="sb-rail">' + (tr.es_recreo ? 'RECREO' : ('TR ' + tr.orden)) + '</div>' +
        '<div class="sb-cols">' +
          '<div class="sb-pane"><table class="sb"><thead><tr><th>Curso</th><th>Docente · Ocup.</th></tr></thead><tbody>' + left + '</tbody></table></div>' +
          '<div class="sb-pane"><table class="sb"><thead><tr><th>Loc</th><th>Docente</th><th>Ocup.</th></tr></thead><tbody>' + right + '</tbody></table></div>' +
        '</div>' +
      '</div>' + libres +
    '</div>';
  }

  function _sbPill(hex) { if (!hex) return 'background:var(--surface-3);color:var(--text);'; return 'background:' + hex + ';color:' + _sbTxt(hex) + ';'; }
  function _sbTint(hex) { if (!hex) return ''; return 'background:' + hex + ';color:' + _sbTxt(hex) + ';'; }
  function _sbTxt(hex) {
    var c = String(hex || '').replace('#',''); if (c.length < 6) return '#1f2430';
    var r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    return ((0.299*r + 0.587*g + 0.114*b) / 255) > 0.62 ? '#1f2430' : '#ffffff';
  }
</script>

<div class="page-head">
  <h2>Sábana</h2>
  <p>Todos los docentes colocados en cada tramo, para localizarlos de un vistazo. Cada tramo muestra las aulas (con su docente) y, a la derecha, los apoyos y cargos numerados por prioridad de sustitución.</p>
</div>

<div class="sb-toolbar">
  <div class="segmented" id="sb-modo">
    <button type="button" data-m="dia" class="active" onclick="setSbModo('dia')">Por día</button>
    <button type="button" data-m="semana" onclick="setSbModo('semana')">Semana completa</button>
  </div>
  <div class="segmented" id="sb-dias">
    <button type="button" data-d="L" class="active" onclick="setSbDia('L')">Lunes</button>
    <button type="button" data-d="M" onclick="setSbDia('M')">Martes</button>
    <button type="button" data-d="X" onclick="setSbDia('X')">Miércoles</button>
    <button type="button" data-d="J" onclick="setSbDia('J')">Jueves</button>
    <button type="button" data-d="V" onclick="setSbDia('V')">Viernes</button>
  </div>
</div>

<div id="sb-body"></div>

<script>
  var SB_DIA = 'L', SB_MODO = 'dia';

  function renderSabana() {
    document.getElementById('sb-dias').style.display = (SB_MODO === 'dia') ? 'inline-flex' : 'none';
    if (SB_MODO === 'semana') _cargarSemana(); else _cargarDia();
  }
  function setSbModo(m) {
    SB_MODO = m;
    document.querySelectorAll('#sb-modo button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-m') === m); });
    renderSabana();
  }
  function setSbDia(d) {
    SB_DIA = d;
    document.querySelectorAll('#sb-dias button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-d') === d); });
    if (SB_MODO === 'dia') renderSabana();
  }

  // Caché por vista (día o semana) válida mientras DATOS_VERSION no cambie:
  // cambiar de día ya visto es instantáneo. `_sbSeq` descarta respuestas
  // que llegan tarde (clics rápidos entre días).
  var _sbCache = {}, _sbCacheVersion = -1, _sbSeq = 0;
  function _sbCargar(clave, pintar, llamar) {
    const cont = document.getElementById('sb-body');
    if (_sbCacheVersion !== DATOS_VERSION) { _sbCache = {}; _sbCacheVersion = DATOS_VERSION; }
    const seq = ++_sbSeq;
    if (_sbCache[clave]) { pintar(_sbCache[clave]); return; }
    cont.innerHTML = '<p class="hint"><span class="spinner"></span> Cargando…</p>';
    const version = DATOS_VERSION;
    llamar(google.script.run
      .withSuccessHandler(function(res) {
        if (version === DATOS_VERSION) _sbCache[clave] = res;
        if (seq === _sbSeq) pintar(res);
      })
      .withFailureHandler(function(err){ if (seq === _sbSeq) cont.innerHTML = _errHtml(err); }));
  }
  function _cargarDia() {
    const dia = SB_DIA;
    _sbCargar('dia:' + dia, _pintarDia, function(run) { run.sabanaDia(dia); });
  }
  function _cargarSemana() {
    _sbCargar('semana', _pintarSemana, function(run) { run.sabanaSemana(); });
  }

  // ---------- Modo por día ----------
  function _pintarDia(res) {
    const cont = document.getElementById('sb-body');
    if (!res || !res.hayTramos) { cont.innerHTML = '<div class="empty">Aún no hay tramos horarios. Configúralos en <b>Configuración → Tramos</b>.</div>'; return; }
    cont.innerHTML = res.tramos.map(function(t){
      if (t.tramo.es_recreo) return _sbRecreo(t.tramo);
      var col = _sbColor(t.tramo.color) || '#4f9d84', st = _sbHeadStyle(col);
      var titulo = String(res.diaLargo || '').toUpperCase() + ' · TRAMO ' + t.tramo.orden + ' · ' + (t.tramo.horas || '');
      return '<div class="sb-tramo">' +
        '<div class="sb-head" style="' + st + '">' + _esc(titulo) + '</div>' +
        '<div class="sb-bodyrow">' +
          '<div class="sb-rail" style="' + st + '">TR ' + _esc(t.tramo.orden) + '</div>' +
          _sbCols(t.cursos, t.apoyos) +
        '</div>' + _sbLibres(t.libres) +
      '</div>';
    }).join('');
  }

  // ---------- Modo semana completa ----------
  function _pintarSemana(res) {
    const cont = document.getElementById('sb-body');
    if (!res || !res.hayTramos) { cont.innerHTML = '<div class="empty">Aún no hay tramos horarios. Configúralos en <b>Configuración → Tramos</b>.</div>'; return; }
    cont.innerHTML = res.tramos.map(function(t){
      if (t.tramo.es_recreo) return _sbRecreo(t.tramo);
      var col = _sbColor(t.tramo.color) || '#4f9d84', st = _sbHeadStyle(col);
      var cols = res.dias.map(function(d){
        var cell = t.porDia[d.k] || { cursos: [], apoyos: [], libres: [] };
        return '<div class="sb-daycol">' +
          '<div class="sb-dayhead" style="' + st + '">' + _esc(d.n) + '</div>' +
          _sbCols(cell.cursos, cell.apoyos) +
          _sbLibres(cell.libres) +
        '</div>';
      }).join('');
      return '<div class="sb-tramo">' +
        '<div class="sb-head" style="' + st + '">TRAMO ' + _esc(t.tramo.orden) + ' · ' + _esc(t.tramo.horas) + '</div>' +
        '<div class="sb-weekscroll"><div class="sb-weekrow">' +
          '<div class="sb-rail" style="' + st + '">TR ' + _esc(t.tramo.orden) + '</div>' + cols +
        '</div></div>' +
      '</div>';
    }).join('');
  }

  // ---------- Piezas compartidas ----------
  function _sbRecreo(tr) {
    return '<div class="sb-recreo">RECREO' + (tr.horas ? (' · ' + _esc(tr.horas)) : '') + '</div>';
  }
  function _sbCols(cursos, apoyos) {
    return '<div class="sb-cols">' +
      '<div class="sb-pane">' + _sbTablaCursos(cursos) + '</div>' +
      '<div class="sb-pane">' + _sbTablaApoyos(apoyos) + '</div>' +
    '</div>';
  }
  function _sbTablaCursos(cursos) {
    var rows = cursos.map(function(c){
      var oc;
      if (c.vacio) oc = '<span class="sb-sin">sin cubrir</span>';
      else oc = c.ocupantes.map(function(o){
        var mat = o.materia ? ('<span class="sb-ocup" style="' + _sbTint(o.color) + '">' + _esc(o.materia) + '</span>')
                            : (o.tutor ? '<span class="sb-tutor">tutoría</span>' : '');
        return '<div class="sb-line"><span class="sb-doc">' + _esc(o.docente || '—') + '</span> ' + mat + '</div>';
      }).join('');
      return '<tr><td class="sb-curso">' + _esc(c.grupo.nombre) + '</td><td>' + oc + '</td></tr>';
    }).join('');
    return '<table class="sb"><thead><tr><th>Curso</th><th>Docente · Ocup.</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }
  function _sbTablaApoyos(apoyos) {
    var rows = apoyos.map(function(a){
      var dest = (a.destino && a.destino.length) ? (' ' + _esc(a.destino.join(' / '))) : '';
      return '<tr><td class="sb-loc">#' + _esc(('0' + a.loc).slice(-2)) + '</td>' +
        '<td class="sb-doc">' + _esc(a.docente) + '</td>' +
        '<td><span class="sb-pill" style="' + _sbPill(a.color) + '" title="' + _esc(a.rolLargo || a.rol) + '">' + _esc(a.rol) + dest + '</span></td></tr>';
    }).join('') || '<tr><td colspan="3" style="padding:8px;color:var(--faint)">—</td></tr>';
    return '<table class="sb"><thead><tr><th>Loc</th><th>Docente</th><th>Ocup.</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }
  function _sbLibres(libres) {
    return libres && libres.length ? ('<div class="sb-libres"><b>Libres (' + libres.length + '):</b> ' + libres.map(_esc).join(' · ') + '</div>') : '';
  }

  // Solo colores hex válidos llegan a un atributo style (vienen de la hoja).
  function _sbColor(c) { return /^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(String(c || '')) ? c : ''; }
  function _sbHeadStyle(col) { return 'background:' + col + ';color:' + _sbTxt(col) + ';'; }
  function _sbPill(hex) { hex = _sbColor(hex); if (!hex) return 'background:var(--surface-3);color:var(--text);'; return 'background:' + hex + ';color:' + _sbTxt(hex) + ';'; }
  function _sbTint(hex) { hex = _sbColor(hex); if (!hex) return ''; return 'background:' + hex + ';color:' + _sbTxt(hex) + ';'; }
  function _sbTxt(hex) {
    var c = String(hex || '').replace('#',''); if (c.length < 6) return '#1f2430';
    var r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    return ((0.299*r + 0.587*g + 0.114*b) / 255) > 0.62 ? '#1f2430' : '#ffffff';
  }
</script>

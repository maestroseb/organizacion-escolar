<div class="page-head sb-head-row">
  <div>
    <h2>Refuerzo, PT y AL</h2>
    <p>Horas semanales de refuerzo, PT y AL por clase y, para el curso elegido, su rejilla semanal: quién entra en cada tramo y qué hay en el aula.</p>
  </div>
  <div class="segmented" id="ap-filtro"></div>
</div>
<div id="ap-body"><p class="hint"><span class="spinner"></span> Cargando…</p></div>

<script>
  var AP = null, AP_V = -1, AP_FILTRO = '', AP_GRUPO = '', AP_AREAS = false;

  function renderApoyos() {
    if (AP && AP_V === DATOS_VERSION) { _apPintar(); return; }
    var v = DATOS_VERSION;
    google.script.run.withSuccessHandler(function(res) { AP = res; AP_V = v; _apPintar(); })
      .withFailureHandler(function(err) { document.getElementById('ap-body').innerHTML = _errHtml(err); })
      .datosApoyos();
  }
  function setApFiltro(t) { AP_FILTRO = t; _apPintar(); }
  function setApGrupo(id) { AP_GRUPO = id; _apPintar(); }
  function setApAreas(on) { AP_AREAS = !!on; _apPintar(); }
  // Clase del grupo en un hueco, sin repetir (varias sesiones = varias pastillas).
  function _apClase(g, dia, tramoId) {
    var vistos = {};
    return (g.horario || []).filter(function(c) {
      if (c.dia !== dia || c.tramo_id !== tramoId) return false;
      var k = c.area + '|' + c.docente + '|' + c.semana; if (vistos[k]) return false; vistos[k] = 1; return true;
    });
  }

  // Minutos → "2:15 h"; si A y B difieren: "A 2:15 h · B 1:30 h".
  function _apH(m) { return Math.floor(m / 60) + ':' + ('0' + (m % 60)).slice(-2) + ' h'; }
  function _apTot(t) { if (!t) return '—'; return t.A === t.B ? _apH(t.A) : 'A ' + _apH(t.A) + ' · B ' + _apH(t.B); }
  function _apSuma(tots, tipos) {
    var s = { A: 0, B: 0 };
    tipos.forEach(function(k) { if (tots[k]) { s.A += tots[k].A; s.B += tots[k].B; } });
    return (s.A || s.B) ? s : null;
  }

  function _apPintar() {
    var tipos = AP.tipos, sel = AP_FILTRO ? [AP_FILTRO] : tipos;
    document.getElementById('ap-filtro').innerHTML = [''].concat(tipos).map(function(k) {
      return '<button type="button" class="' + (k === AP_FILTRO ? 'active' : '') + '" onclick="setApFiltro(\'' + k + '\')">' + (k || 'Todos') + '</button>';
    }).join('');
    var body = document.getElementById('ap-body');
    var grupos = AP.grupos.filter(function(g) { return g.filas.some(function(f) { return sel.indexOf(f.tipo) !== -1; }); });
    if (!grupos.length) { body.innerHTML = '<div class="empty">Ninguna clase recibe ' + (AP_FILTRO || 'refuerzo, PT ni AL') + ' en los horarios.</div>'; return; }

    if (!grupos.some(function(g) { return g.id === AP_GRUPO; })) AP_GRUPO = '';
    // Resumen: horas por clase y tipo (pulsar una fila muestra su horario).
    var tot = { A: 0, B: 0 }, totTipo = {};
    var res = '<div class="tablewrap ap-resumen"><table class="sb"><thead><tr><th>Curso</th>' +
      sel.map(function(k) { return '<th>' + k + '</th>'; }).join('') + (sel.length > 1 ? '<th>Total</th>' : '') + '</tr></thead><tbody>' +
      grupos.map(function(g) {
        var s = _apSuma(g.totales, sel); if (s) { tot.A += s.A; tot.B += s.B; }
        sel.forEach(function(k) { var t = g.totales[k]; if (t) { var x = totTipo[k] || (totTipo[k] = { A: 0, B: 0 }); x.A += t.A; x.B += t.B; } });
        return '<tr class="ap-fila' + (g.id === AP_GRUPO ? ' on' : '') + '" onclick="setApGrupo(' + _jsAttr(g.id) + ')" title="Ver su horario"><td class="sb-curso">' + _esc(g.nombre) + '</td>' + sel.map(function(k) { return '<td>' + _apTot(g.totales[k]) + '</td>'; }).join('') +
          (sel.length > 1 ? '<td><b>' + _apTot(s) + '</b></td>' : '') + '</tr>';
      }).join('') +
      '<tr class="ap-total"><td>Total</td>' + sel.map(function(k) { return '<td>' + _apTot(totTipo[k]) + '</td>'; }).join('') +
      (sel.length > 1 ? '<td>' + _apTot(tot) + '</td>' : '') + '</tr></tbody></table></div>';

    // Rejilla semanal del curso elegido (como en Horarios individuales).
    var g = grupos.filter(function(x) { return x.id === AP_GRUPO; })[0];
    var filas = g ? g.filas.filter(function(f) { return sel.indexOf(f.tipo) !== -1; }) : [];
    var dias = [{k:'L',n:'Lunes'},{k:'M',n:'Martes'},{k:'X',n:'Miércoles'},{k:'J',n:'Jueves'},{k:'V',n:'Viernes'}];
    var det = '<div class="ap-bar"><label for="ap-grupo">Curso</label><select id="ap-grupo" onchange="setApGrupo(this.value)">' +
      '<option value="">— elige curso —</option>' + grupos.map(function(x) { return '<option value="' + _esc(x.id) + '"' + (x.id === AP_GRUPO ? ' selected' : '') + '>' + _esc(x.nombre) + '</option>'; }).join('') +
      '</select>' + (g ? '<span class="ap-bar-tot">' + _esc(g.nombre) + ': ' + _apTot(_apSuma(g.totales, sel)) + '</span>' +
        '<label class="ap-chk"><input type="checkbox"' + (AP_AREAS ? ' checked' : '') + ' onchange="setApAreas(this.checked)"> Mostrar las áreas de la clase</label>' : '') + '</div>' +
      (!g ? '<div class="empty">Elige un curso para ver su horario de refuerzo, PT y AL.</div>' :
      '<div class="hd-wrap"><table class="hd ap-rej"><thead><tr><th class="hd-th-tramo">Tramo</th>' + dias.map(function(d) { return '<th>' + d.n + '</th>'; }).join('') + '</tr></thead><tbody>' +
      (AP.tramos || []).map(function(t) {
        if (t.es_recreo) return '<tr class="ap-rec"><th class="hd-th-tramo">Recreo<span class="hd-horas">' + _esc(t.horas) + '</span></th><td colspan="5"></td></tr>';
        return '<tr><th class="hd-th-tramo">T' + _esc(t.orden) + '<span class="hd-horas">' + _esc(t.horas) + '</span></th>' + dias.map(function(d) {
          var fs = filas.filter(function(f) { return f.dia === d.k && f.tramo_id === t.id; });
          // La clase sale una sola vez por celda: siempre que haya apoyo y, con
          // «Mostrar las áreas», en todas (y la celda toma el color del área).
          var cl = (fs.length || AP_AREAS) ? _apClase(g, d.k, t.id) : [];
          var fondo = AP_AREAS && cl.length && _sbColor(cl[0].color) ? ' style="background:color-mix(in srgb, ' + _sbColor(cl[0].color) + ' 16%, var(--surface))"' : '';
          var clase = cl.length ? '<div class="ap-clase">' + cl.map(function(c) {
            return '<span class="ap-area"><span class="sb-pill" style="' + _sbPill(c.color) + '">' + _esc(c.area || '—') + '</span> ' + _esc(c.docente) +
              (c.semana ? ' <span class="ap-sem">' + _esc(c.semana) + '</span>' : '') + '</span>';
          }).join('') + '</div>' : '';
          return '<td' + fondo + '>' + clase + fs.map(function(f) {
            return '<div class="ap-ent"><span class="sb-pill" style="' + _sbPill(f.color) + '">' + _esc(f.rol) + '</span> <b>' + _esc(f.apoyo) + '</b>' +
              (f.semana ? ' <span class="ap-sem">' + _esc(f.semana) + '</span>' : '') + '</div>';
          }).join('') + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>');
    // Resumen a la izquierda y horario del curso a la derecha (se apilan si no caben).
    body.innerHTML = '<div class="ap-layout"><div class="ap-izq">' + res + '</div><div class="ap-der">' + det + '</div></div>';
  }
</script>

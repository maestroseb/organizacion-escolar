  <script>
    // Pestaña inicial pasada por el servidor (deep-link ?page=).
    // Escapamos '<' para que un ?page= malicioso no pueda cerrar el <script> (XSS reflejado).
    var PESTANA_INICIAL = <?!= JSON.stringify(String(pestanaInicial || '')).replace(/</g, '\\u003c') ?>;
    // Datos ya incluidos en la página (ver _datosIniciales en 09_Web.gs): la
    // sábana se pinta sin esperar al servidor. null → se piden como siempre.
    var INICIAL = <?!= JSON.stringify(inicial || null).replace(/</g, '\\u003c') ?>;

    // Pestañas superiores del espacio de trabajo (uso diario).
    var TABS = [
      { key: 'sabana',         label: 'Localizaciones' },
      { key: 'ahora',          label: 'Ahora' },
      { key: 'sustituciones',  label: 'Sustituciones' },
      { key: 'horario',        label: 'Horarios individuales' },
      { key: 'apoyos',         label: 'Refuerzo, PT y AL' },
      { key: 'recreos',        label: 'Recreos' },
      // Configuración va como engranaje junto al tema (no en la barra) y
      // solo con permiso de Edición.
      { key: 'config',         label: 'Configuración', permiso: 'edicion', oculta: true }
    ];
    var INICIO = 'sabana';

    // Submenú dentro de Configuración: datos del centro e importación.
    var CONFIG_SUBTABS = [
      { key: 'centro',         label: 'Centro y ajustes' },
      { key: 'tramos',         label: 'Tramos y semanas', cont: 'tramos' },
      { key: 'grupos',         label: 'Grupos y aulas',  cont: 'grupos' },
      { key: 'docentes',       label: 'Docentes',        cont: 'docentes' },
      { key: 'areas',          label: 'Áreas y cargos',  cont: 'materias' },
      { key: 'importar',       label: 'Importar' },
      { key: 'revision',       label: 'Revisión' }
    ];
    var CONFIG_KEYS = CONFIG_SUBTABS.map(function(t) { return t.key; });
    // Claves antiguas o de secciones fusionadas (modo guiado, enlaces, hash).
    var ALIAS = { semanas: 'tramos', ajustes: 'centro' };
    function _alias(k) { return ALIAS[k] || k; }

    var ESTADO = null;         // último estadoApp()
    var GUIADO = false;        // modo alta guiada: avanza por pendientes
    var PENDIENTES = [];       // claves de secciones pendientes (modo guiado)
    var OB_VOLCADO = null;     // volcado pendiente de revisar en Importar (puente onboarding→workspace)
    var VISTA_ACTUAL = INICIO;
    var CONFIG_SUB_ACTUAL = 'centro';
    var DATOS_VERSION = 0;     // se incrementa tras cada guardado (invalida cachés de vistas)
    var _PREFETCH = {};        // nombre de función .gs -> resultado en vuelo (ver _prefetch)
    var _CARGADO = {};         // vista -> DATOS_VERSION con la que se cargó (no recargar si no cambió)

    // El tema se aplica cuanto antes (evita el parpadeo claro→oscuro) y el
    // arranque no espera a 'load': el shell entero ya está en el DOM.
    aplicarTemaGuardado();
    // Siempre tras cargar todos los <script> (sus `var` ya inicializados).
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar);
    else setTimeout(arrancar, 0);

    function arrancar() {
      _cabecerasCompactas();
      // Ajustes generales dentro de «Centro y ajustes».
      var src = document.getElementById('ajustes-src'), dst = document.getElementById('centro-ajustes');
      if (src && dst) { while (src.firstChild) dst.appendChild(src.firstChild); src.remove(); }
      if (INICIAL && INICIAL.estado) { _arrancarConInicial(INICIAL); INICIAL = null; return; }
      // La sábana (vista inicial) se pide en paralelo con estadoApp.
      const destino = _pestanaDesdeHash() || PESTANA_INICIAL || INICIO;
      if (destino === 'sabana') _prefetch('sabanaSemana');
      google.script.run
        .withSuccessHandler(function(estado) {
          ESTADO = estado;
          if (estado && estado.configurado) {
            entrarWorkspace();
          } else {
            delete _PREFETCH.sabanaSemana;
            mostrarOnboarding();
          }
        })
        .withFailureHandler(function(err) {
          console.error(err);
          mostrarOnboarding();
        })
        .estadoApp();
    }

    function _arrancarConInicial(ini) {
      ESTADO = ini.estado;
      if (!ESTADO.configurado) { mostrarOnboarding(); return; }
      // Siembra las cachés: sábana (A y B) y lecturas de uso diario.
      if (ini.sabanas) window.SB_INICIAL = ini.sabanas;
      _RPC_V = DATOS_VERSION;
      Object.keys(ini.lecturas || {}).forEach(function(n) { _RPC[n + '[]'] = { ok: true, res: ini.lecturas[n], cbs: [] }; });
      entrarWorkspace();
    }

    // ---------- Llamadas al servidor con caché de lecturas ----------
    // _run() se usa igual que google.script.run. Las funciones de solo lectura
    // (LECTURAS) se sirven de memoria mientras DATOS_VERSION no cambie (se
    // incrementa tras cada guardado) y dos peticiones iguales a la vez se
    // fusionan en una. Cada llamante recibe su propia copia (pueden mutarla).
    var LECTURAS = { listarSemanas: 1, listarDocentes: 1, listarGrupos: 1, listarTramos: 1, listarMaterias: 1, listarRoles: 1,
                     listarLocalizaciones: 1, obtenerCentro: 1, datosHorarios: 1 };
    var _RPC = {}, _RPC_V = -1;
    function _copia(x) { return x == null ? x : JSON.parse(JSON.stringify(x)); }
    function _srv(nombre, args) {
      if (_RPC_V !== DATOS_VERSION) { _RPC = {}; _RPC_V = DATOS_VERSION; }
      var k = nombre + JSON.stringify(args), e = _RPC[k];
      if (!e) {
        e = _RPC[k] = { cbs: [] };
        var r = google.script.run
          .withSuccessHandler(function(res) { e.ok = true; e.res = res; e.cbs.forEach(function(c) { c(null, res); }); e.cbs = []; })
          .withFailureHandler(function(err) { if (_RPC[k] === e) delete _RPC[k]; e.cbs.forEach(function(c) { c(err); }); e.cbs = []; });
        r[nombre].apply(r, args);
      }
      return function(cb) { if (e.ok) setTimeout(function() { cb(null, e.res); }, 0); else e.cbs.push(cb); };
    }
    function _run() {
      var ok = null, ko = null, o = {}, px;
      o.withSuccessHandler = function(f) { ok = f; return px; };
      o.withFailureHandler = function(f) { ko = f; return px; };
      return px = new Proxy(o, { get: function(t, p) {
        if (p in t) return t[p];
        return function() {
          var args = Array.prototype.slice.call(arguments);
          if (LECTURAS[p]) {
            _srv(p, args)(function(err, res) { if (err) { if (ko) ko(err); } else if (ok) ok(_copia(res)); });
          } else {
            var r = google.script.run;
            // Una escritura invalida la caché de lecturas en cuanto responde
            // (la sección se recarga antes de que llegue el nuevo estadoApp).
            var escribe = /^(guardar|vaciar|reiniciar|aplicar|importar|crear|elimin|actualiz|borrar)/i.test(p);
            if (ok || escribe) r = r.withSuccessHandler(function(res) { if (escribe) _RPC = {}; if (ok) ok(res); });
            if (ko) r = r.withFailureHandler(ko);
            r[p].apply(r, args);
          }
        };
      } });
    }
    // Precarga en segundo plano (cuando el navegador está libre).
    function precargar(nombre, args) {
      var f = function() { if (LECTURAS[nombre]) _srv(nombre, args || [])(function() {}); };
      if (window.requestIdleCallback) requestIdleCallback(f, { timeout: 3000 }); else setTimeout(f, 800);
    }

    // ---------- Prefetch de llamadas al servidor ----------
    function _prefetch(nombre) {
      const p = { done: false, err: null, res: null, cbs: [] };
      _PREFETCH[nombre] = p;
      const fin = function(err, res) { p.done = true; p.err = err; p.res = res; p.cbs.forEach(function(cb) { cb(err, res); }); };
      google.script.run
        .withSuccessHandler(function(r) { fin(null, r); })
        .withFailureHandler(function(e) { fin(e || new Error('Error'), null); })[nombre]();
    }
    // Entrega el resultado prefetch (si lo hay) y lo consume. Devuelve false si no había.
    function _consumirPrefetch(nombre, cb) {
      const p = _PREFETCH[nombre];
      if (!p) return false;
      delete _PREFETCH[nombre];
      if (p.done) cb(p.err, p.res); else p.cbs.push(cb);
      return true;
    }

    // ---------- Workspace ----------
    function entrarWorkspace(pestana) {
      document.getElementById('onboarding').style.display = 'none';
      document.getElementById('workspace').style.display = 'block';
      if (typeof botMostrar === 'function') botMostrar(true);
      _aplicarPermisos();
      pintarCabecera();
      construirTabs();
      const destino = pestana || _pestanaDesdeHash() || PESTANA_INICIAL || INICIO;
      irPestana(_keyValida(destino) ? destino : INICIO);
    }

    function pintarCabecera() {
      const c = ESTADO && ESTADO.centro;
      if (c && c.nombre) document.getElementById('brand-nombre').textContent = c.nombre;
      const sub = [];
      if (c && c.codigo) sub.push('Cód. ' + c.codigo);
      if (c && c.curso_academico) sub.push(c.curso_academico);
      document.getElementById('brand-sub').textContent = sub.join(' · ') || 'Horarios y sustituciones';
    }

    // Tonos (hue HSL) de las pestañas: violeta, azul cielo, rosa, verde, ámbar, índigo, turquesa.
    var TAB_TONOS = [265, 200, 330, 150, 35, 235, 175];
    function construirTabs() {
      const nav = document.getElementById('tabs');
      nav.innerHTML = '';
      var vis = TABS.filter(function(t) { return _tabPermitida(t) && !t.oculta; });
      vis.forEach(function(t, i) {
        const b = document.createElement('button');
        b.className = 'tab';
        b.style.zIndex = vis.length - i;          // cada pestaña, por detrás de la anterior
        b.style.setProperty('--k', i);            // y un poco más oscura
        b.style.setProperty('--h', TAB_TONOS[i % TAB_TONOS.length]); // tono del cristal
        b.id = 'tab-' + t.key;
        b.type = 'button';
        if (t.soon) {
          b.disabled = true;
          b.innerHTML = t.label + ' <span class="soon">pronto</span>';
        } else {
          b.textContent = t.label;
          b.onclick = function() { irPestana(t.key); };
        }
        nav.appendChild(b);
      });
    }

    // Permiso de Edición (Equipo Directivo / administrador). El resto del
    // profesorado solo ve: sin Configuración ni botones de guardar o editar.
    function puedeEditar() { return !!(ESTADO && ESTADO.permisos && (ESTADO.permisos.edicion || ESTADO.permisos.sustituciones)); }
    function soloLectura(msg) { if (puedeEditar()) return false; aviso(msg || 'Solo lectura: necesitas permiso de Edición.', 'err'); return true; }
    function _aplicarPermisos() {
      document.body.classList.toggle('solo-lectura', !puedeEditar());
      var c = document.getElementById('tab-config'); if (c) c.hidden = !puedeEditar();
    }
    function _tabPermitida(t) {
      return !t.permiso || !!(ESTADO && ESTADO.permisos && ESTADO.permisos[t.permiso]);
    }
    function _tabValida(key) {
      return TABS.some(function(t) { return t.key === key && !t.soon && _tabPermitida(t); });
    }
    function _keyValida(key) {
      return _tabValida(_alias(key)) || CONFIG_KEYS.indexOf(_alias(key)) !== -1;
    }

    var LOADERS = {
      sabana: function() { renderSabana(); },
      apoyos: function() { renderApoyos(); },
      ahora: function() { renderAhora(); },
      sustituciones: function() { renderSustituciones(); },
      horario: function() { renderHorario(); },
      recreos: function() { renderRecreos(); },
      importar: function() { prepararImportar(); },
      centro: function() { cargarCentro(); renderConfig(); },
      tramos: function() { cargarTramos(); cargarSemanas(); },
      revision: function() { renderProblemas(); },
      grupos: function() { cargarGrupos(); cargarLocalizaciones(); },
      docentes: function() { cargarDocentes(); },
      areas: function() { cargarMaterias(); cargarRoles(); }
    };

    function irPestana(key) {
      key = _alias(key);
      // La pestaña "Configuración" abre el hub (submenú + última subsección).
      // Sin permiso de Edición no se entra en Configuración (ni por enlace).
      if ((key === 'config' || CONFIG_KEYS.indexOf(key) !== -1) && !puedeEditar()) key = INICIO;
      if (key === 'config') { irConfig(CONFIG_SUB_ACTUAL); return; }
      if (!_keyValida(key)) key = INICIO;
      // Las secciones de datos viven dentro de Configuración.
      if (CONFIG_KEYS.indexOf(key) !== -1) { irConfig(key); return; }

      VISTA_ACTUAL = key;
      document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
      document.querySelectorAll('#tabs .tab').forEach(function(t) { t.classList.remove('active'); });
      document.getElementById('config-subnav').style.display = 'none';
      var tc = document.getElementById('tab-config'); if (tc) tc.classList.remove('active');

      const view = document.getElementById('view-' + key);
      const tab = document.getElementById('tab-' + key);
      if (view) view.classList.add('active');
      if (tab) tab.classList.add('active');
      try { history.replaceState(null, '', '#' + key); } catch (e) {}

      _ejecutarLoader(key);
      revisarCambios();
      window.scrollTo(0, 0);
    }

    // Configuración con submenú: 'ajustes' + todas las secciones de datos.
    function irConfig(sub) {
      sub = _alias(sub);
      sub = (CONFIG_KEYS.indexOf(sub) !== -1) ? sub : 'centro';
      VISTA_ACTUAL = sub;
      CONFIG_SUB_ACTUAL = sub;

      document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
      document.querySelectorAll('#tabs .tab').forEach(function(t) { t.classList.remove('active'); });
      const topTab = document.getElementById('tab-config');
      if (topTab) topTab.classList.add('active');

      construirSubnav(sub);
      const view = document.getElementById('view-' + sub);
      if (view) view.classList.add('active');
      try { history.replaceState(null, '', '#' + sub); } catch (e) {}

      _ejecutarLoader(sub);
      revisarCambios();
      window.scrollTo(0, 0);
    }

    function construirSubnav(sub) {
      const cont = (ESTADO && ESTADO.contadores) || {};
      const nav = document.getElementById('config-subnav');
      nav.style.display = 'flex';
      nav.innerHTML = '';
      CONFIG_SUBTABS.forEach(function(t) {
        const b = document.createElement('button');
        b.className = 'subtab' + (t.key === sub ? ' active' : '');
        b.type = 'button';
        let pill = '';
        if (t.cont && cont[t.cont] != null) pill = ' <span class="pill" id="pillsub-' + t.key + '">' + cont[t.cont] + '</span>';
        b.innerHTML = t.label + pill;
        b.onclick = function() { irConfig(t.key); };
        nav.appendChild(b);
      });
    }

    // Cada vista se carga una vez y se conserva (DOM incluido) mientras los
    // datos no cambien: volver a una pestaña no pide nada al servidor.
    function _ejecutarLoader(key) {
      const fn = LOADERS[key];
      if (typeof fn !== 'function' || _CARGADO[key] === DATOS_VERSION) return;
      _CARGADO[key] = DATOS_VERSION;
      try { fn(); } catch (e) { console.error(e); delete _CARGADO[key]; }
    }

    function _pestanaDesdeHash() {
      const h = (location.hash || '').replace('#', '');
      return h || '';
    }

    // ---------- Estado / contadores ----------
    function refrescarEstado(cb) {
      google.script.run
        .withSuccessHandler(function(estado) {
          _aplicarEstado(estado);
          if (cb) cb(estado);
        })
        .withFailureHandler(function(err) { console.error(err); if (cb) cb(null); })
        .estadoApp();
    }
    function _aplicarEstado(estado) {
      ESTADO = estado;
      _aplicarPermisos();
      DATOS_VERSION++;
      pintarCabecera();
      actualizarPills();
    }

    function actualizarPills() {
      const cont = (ESTADO && ESTADO.contadores) || {};
      CONFIG_SUBTABS.forEach(function(t) {
        if (!t.cont) return;
        const el = document.getElementById('pillsub-' + t.key);
        if (el && cont[t.cont] != null) el.textContent = cont[t.cont];
      });
    }

    // ---------- Modo guiado (tras el alta) ----------
    function avanzarGuiado() {
      if (!GUIADO) return;
      google.script.run.withSuccessHandler(function(res) {
        PENDIENTES = (res && res.pendientes) || [];
        // Quitar la sección actual (ya guardada) y saltar a la siguiente pendiente.
        // Secciones fusionadas (Tramos + Semanas) cuentan como la misma vista:
        // no se "avanza" a la vista actual (recargaría y perdería ediciones).
        const actual = _alias(VISTA_ACTUAL);
        const siguiente = PENDIENTES.map(_alias).filter(function(k) { return k !== actual; })[0];
        if (siguiente) {
          irPestana(siguiente);
        } else {
          GUIADO = false;
          irPestana(INICIO);
        }
      }).withFailureHandler(function(err) { console.error(err); }).analizarConfiguracion();
    }

    // ---------- Onboarding: mostrar ----------
    function mostrarOnboarding() {
      document.getElementById('workspace').style.display = 'none';
      document.getElementById('onboarding').style.display = 'block';
      if (typeof botMostrar === 'function') botMostrar(false);
      if (typeof iniciarOnboarding === 'function') iniciarOnboarding();
    }

    // Llamada desde el onboarding al terminar: entra al workspace en modo guiado.
    function finalizarOnboarding(pendientes) {
      GUIADO = (pendientes && pendientes.length > 0);
      PENDIENTES = pendientes || [];
      refrescarEstado(function() {
        entrarWorkspace(GUIADO ? (PENDIENTES[0] || INICIO) : INICIO);
      });
    }

    // Desde el onboarding: recalcula pendientes y estado (en paralelo) y entra
    // al workspace en `destino` en modo guiado. `trasEntrar` es opcional.
    function entrarGuiadoEn(destino, trasEntrar) {
      let pendientes = 2;
      const fin = function() {
        if (--pendientes > 0) return;
        entrarWorkspace(destino);
        if (trasEntrar) trasEntrar();
      };
      google.script.run
        .withSuccessHandler(function(an) {
          PENDIENTES = (an && an.pendientes) || [];
          GUIADO = PENDIENTES.length > 0;
          fin();
        })
        .withFailureHandler(function(err) { console.error(err); fin(); })
        .analizarConfiguracion();
      refrescarEstado(fin);
    }

    // ---------- Tema ----------
    function aplicarTemaGuardado() {
      let t = null;
      try { t = localStorage.getItem('tema'); } catch (e) {}
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      // (ZOOMS aún no está definido aquí: se aplica al cargar el DOM.)
      var pinta = function() { aplicarZoomGuardado(); _iconoTema(); };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', pinta); else pinta();
      if (window.matchMedia) { var mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', _iconoTema); }
    }
    function _oscuroActivo() {
      const actual = document.documentElement.getAttribute('data-theme');
      return actual === 'dark' || (!actual && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    }
    // Icono del botón: la luna pasa a modo oscuro; en modo oscuro, el sol vuelve al claro.
    var _SVG_LUNA = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
    var _SVG_SOL = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2 12h2.2M19.8 12H22M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>';
    function _iconoTema() {
      var b = document.getElementById('btn-tema'); if (!b) return;
      var osc = _oscuroActivo();
      b.innerHTML = osc ? _SVG_SOL : _SVG_LUNA;
      b.title = osc ? 'Pasar a modo claro' : 'Pasar a modo oscuro';
    }

    // ---------- Tamaño de letra (zoom del contenido, se recuerda) ----------
    var ZOOMS = [0.85, 0.9, 1, 1.1, 1.2, 1.35, 1.5], ZOOM = 1;
    function aplicarZoomGuardado() {
      try { var z = parseFloat(localStorage.getItem('zoom')); if (ZOOMS.indexOf(z) !== -1) ZOOM = z; } catch (e) {}
      _aplicarZoom();
    }
    function cambiarZoom(d) {
      var i = ZOOMS.indexOf(ZOOM);
      ZOOM = d === 0 ? 1 : ZOOMS[Math.max(0, Math.min(ZOOMS.length - 1, i + d))];
      try { localStorage.setItem('zoom', ZOOM); } catch (e) {}
      _aplicarZoom();
    }
    function _aplicarZoom() {
      // Solo el contenido: la barra superior y Bedel mantienen su tamaño.
      var m = document.querySelector('main.shell'); if (m) m.style.zoom = ZOOM === 1 ? '' : ZOOM;
      var v = document.getElementById('zoom-val'); if (v) v.textContent = Math.round(ZOOM * 100) + '%';
      if (typeof _pedirAjuste === 'function') _pedirAjuste();
    }
    function alternarTema() {
      const nuevo = _oscuroActivo() ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', nuevo);
      try { localStorage.setItem('tema', nuevo); } catch (e) {}
      _iconoTema();
    }

    // ---------- Helpers compartidos ----------
    function _esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    // Literal JS seguro dentro de un atributo on*="…": f(' + _jsAttr(x) + ')
    function _jsAttr(v) { return _esc(JSON.stringify(v == null ? '' : v)); }
    // Mensaje de error de google.script.run, escapado.
    function _errMsg(err) { return _esc((err && err.message) || err || 'Error desconocido'); }
    // Lee un archivo de texto (CSV…) como UTF-8; si trae caracteres
    // inválidos (exportado en Windows), lo relee como Windows-1252.
    function leerArchivoTexto(file, ok, ko) {
      var leer = function(enc, sig) {
        var r = new FileReader();
        r.onload = function(e) { var t = String(e.target.result || ''); if (sig && t.indexOf('\uFFFD') !== -1) sig(); else ok(t.replace(/^\uFEFF/, '')); };
        r.onerror = function() { if (ko) ko(); };
        r.readAsText(file, enc);
      };
      leer('UTF-8', function() { leer('windows-1252'); });
    }
    function _errHtml(err) { return '<div class="result err">✗ ' + _errMsg(err) + '</div>'; }
    // Invalida cachés de vistas (sábana, horario…) tras cambiar datos.
    function datosCambiados() { DATOS_VERSION++; }
    function mostrarErrorGenerico(err) {
      console.error(err);
      aviso('Error: ' + ((err && err.message) || err), 'err');
    }
    // ---------- Cambios pendientes: botón flotante «Guardar» ----------
    // Cada vista declara sus bloques guardables (estado actual + cómo guardar).
    // Al cargar un bloque se toma una foto (_snap); si el estado difiere de la
    // foto aparece el botón; si se deshacen los cambios, desaparece.
    var GUARDABLES = {}, _SNAP = {};
    function registrarGuardable(vista, clave, estado, guardar) {
      (GUARDABLES[vista] = GUARDABLES[vista] || []).push({ clave: clave, estado: estado, guardar: guardar });
    }
    (window._REG_GUARDABLES || []).forEach(function(a) { registrarGuardable.apply(null, a); });
    window._REG_GUARDABLES = { push: function(a) { registrarGuardable.apply(null, a); } };
    function _estadoDe(g) { try { return JSON.stringify(g.estado()); } catch (e) { return ''; } }
    // Sin foto todavía: solo cuenta como cambio si ya hay datos (no al abrir la vista).
    function _sucio(g) {
      var cur = _estadoDe(g), snap = _SNAP[g.clave];
      // null = no hay nada abierto (p. ej. «— elige docente —»): nada que guardar.
      if (cur === 'null') return false;
      return snap === undefined ? !(cur === 'null' || cur === '' || cur === '[]') : snap !== cur;
    }
    function _snap(clave) {
      Object.keys(GUARDABLES).forEach(function(v) {
        GUARDABLES[v].forEach(function(g) { if (g.clave === clave) _SNAP[clave] = _estadoDe(g); });
      });
      _fabListo(); revisarCambios();
    }
    function _pendientes(vista) {
      return (GUARDABLES[vista] || []).filter(_sucio);
    }
    function hayCambios(clave) {
      return Object.keys(GUARDABLES).some(function(v) {
        return GUARDABLES[v].some(function(g) { return g.clave === clave && _sucio(g); });
      });
    }
    var _revTimer = null;
    function revisarCambios() {
      clearTimeout(_revTimer);
      _revTimer = setTimeout(function() {
        var fab = document.getElementById('fab-guardar');
        if (!fab) return;
        var n = _pendientes(VISTA_ACTUAL).length;
        fab.classList.toggle('visible', n > 0 && document.getElementById('workspace').style.display !== 'none');
      }, 0);
    }
    function guardarPendientes() {
      var p = _pendientes(VISTA_ACTUAL);
      if (!p.length) return;
      var fab = document.getElementById('fab-guardar');
      fab.disabled = true; fab.innerHTML = '<span class="spinner"></span> Guardando…';
      p.forEach(function(g) { g.guardar(); });
      setTimeout(_fabListo, 15000); // por si algún guardado no responde
    }
    function _fabListo() {
      var fab = document.getElementById('fab-guardar');
      if (fab) { fab.disabled = false; fab.textContent = 'Guardar cambios'; }
      revisarCambios();
    }
    ['input', 'change', 'click', 'drop', 'dragend'].forEach(function(ev) { document.addEventListener(ev, revisarCambios, true); });
    window.addEventListener('beforeunload', function(e) {
      var sucio = Object.keys(GUARDABLES).some(function(v) { return _pendientes(v).length; });
      if (sucio) { e.preventDefault(); e.returnValue = ''; }
    });

    // ---------- Cajas con scroll: que quepan en la pantalla ----------
    // Cada caja (tabla, rejilla…) mide como mucho lo que queda de pantalla
    // desde su borde superior, dejando sitio a lo que va debajo en su columna
    // (p. ej. el botón Guardar). Se recalcula al cambiar de vista o de tamaño.
    var _CAJAS = '.view.active #rc-pool-list, .view.active .rc-body, .view.active .tablewrap, .view.active .hd-wrap, .view.active .rev-scroll, .view.active .su-wrap, .view.active .sb-weekscroll';
    function ajustarAltos() {
      // Con cajas de scroll, el pie de página no reserva el hueco del botón
      // flotante (la caja llega abajo y la página no se desplaza).
      document.body.classList.toggle('con-cajas', !!document.querySelector(_CAJAS));
      document.querySelectorAll(_CAJAS).forEach(function(c) {
        if (!c.offsetParent) return;
        var r = c.getBoundingClientRect(), top = r.top + window.scrollY;
        var col = c.closest('.col-sec, .hi-col, .view') || c.parentElement;
        // Lo que va debajo de la caja en su columna (hermanos siguientes).
        var debajo = 0;
        for (var el = c; el && el !== col; el = el.parentElement)
          for (var sb = el.nextElementSibling; sb; sb = sb.nextElementSibling)
            // Solo lo que queda debajo (no lo que va al lado, p. ej. en una rejilla).
            if (sb.offsetParent && sb.getBoundingClientRect().top >= r.bottom - 1) debajo += sb.getBoundingClientRect().height + 10;
        // Alto visible que queda (en px de pantalla). Con zoom, los px de CSS
        // no son px de pantalla: se mide la proporción real y se convierte.
        var alto = Math.max(220, window.innerHeight - top - debajo - 16);
        c.style.maxHeight = alto + 'px';
        var k = c.getBoundingClientRect().height / (c.offsetHeight || 1) || 1;
        if (Math.abs(k - 1) > 0.01) c.style.maxHeight = Math.max(220 / k, alto / k) + 'px';
        // Si aun así la página se desplaza (márgenes, rellenos…), se recorta lo
        // que sobra: la caja no debe meterse bajo la cabecera fija.
        var sobra = document.documentElement.scrollHeight - window.innerHeight;
        if (sobra > 0 && sobra < 150 && c.scrollHeight > c.clientHeight) c.style.maxHeight = Math.max(220 / k, parseFloat(c.style.maxHeight) - sobra / k) + 'px';
      });
    }
    var _altoPend = false;
    function _pedirAjuste() { if (_altoPend) return; _altoPend = true; requestAnimationFrame(function() { _altoPend = false; ajustarAltos(); }); }
    window.addEventListener('resize', _pedirAjuste);
    // Se recalcula ante cualquier cambio: DOM, tamaño (fuentes que cargan
    // tarde, textos que se recolocan…) y al terminar de cargar. Se engancha
    // ya (no en DOMContentLoaded): la sábana puede pintarse antes.
    (function() {
      var enganchar = function() {
        var m = document.querySelector('main') || document.body;
        new MutationObserver(_pedirAjuste).observe(m, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
        if (window.ResizeObserver) new ResizeObserver(_pedirAjuste).observe(document.body);
        _pedirAjuste();
      };
      if (document.body) enganchar(); else document.addEventListener('DOMContentLoaded', enganchar);
      window.addEventListener('load', _pedirAjuste);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(_pedirAjuste);
    })();

    // ---------- Avisos de «guardado» como toast ----------
    // Los mensajes breves de éxito (.result.ok) que pintan las vistas se
    // convierten en un toast que desaparece solo. Los errores y los resúmenes
    // largos (con listas, tablas…) se quedan en la página.
    function _aToast(n) {
      if (n.nodeType !== 1) return;
      var rs = n.matches('.result.ok:not(.fijo)') ? [n] : Array.prototype.slice.call(n.querySelectorAll('.result.ok:not(.fijo)'));
      rs.forEach(function(r) {
        // El toast ya pone su propia marca «✓»: no se repite.
        var txt = r.textContent.trim().replace(/^✓\s*/, '');
        if (!txt || txt.length > 200 || r.querySelector('ul, ol, table, div, button, a, input')) return;
        aviso(txt, 'ok'); r.remove();
      });
    }
    document.addEventListener('DOMContentLoaded', function() {
      new MutationObserver(function(ms) { ms.forEach(function(m) { m.addedNodes.forEach(_aToast); }); })
        .observe(document.body, { childList: true, subtree: true });
    });

    // ---------- Modales: clic fuera o Esc = Cancelar ----------
    // Se pulsa el propio botón Cancelar del modal (así se respetan sus
    // confirmaciones, p. ej. el pintado con cambios). Solo cuenta si el clic
    // empieza y acaba en el fondo (arrastrar desde dentro no cierra).
    function _cancelarModal(ov) {
      var b = Array.prototype.filter.call(ov.querySelectorAll('button'), function(x) {
        return /^cancelar$/i.test(x.textContent.trim()) || /^cerrar/i.test(x.title || '');
      })[0];
      if (b) b.click(); else ov.classList.remove('show');
    }
    var _ovDown = null;
    document.addEventListener('mousedown', function(e) { _ovDown = e.target.classList && e.target.classList.contains('modal-overlay') ? e.target : null; });
    document.addEventListener('click', function(e) {
      if (_ovDown && e.target === _ovDown && _ovDown.classList.contains('show')) _cancelarModal(_ovDown);
      _ovDown = null;
    });
    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Escape') return;
      var abiertos = document.querySelectorAll('.modal-overlay.show');
      if (!abiertos.length) return;
      // La confirmación va siempre por encima del resto.
      var conf = document.querySelector('#modal-confirm.show');
      e.preventDefault(); _cancelarModal(conf || abiertos[abiertos.length - 1]);
    });

    // ---------- Pegar desde una hoja de cálculo en las tablas editables ----------
    // Si el portapapeles trae varias celdas (tabuladores / saltos de línea), se
    // reparten a partir de la celda donde se pega: filas hacia abajo, columnas a
    // la derecha. Faltan filas → se añaden (tbody[data-anadir]). Casillas: sí/x/1.
    document.addEventListener('paste', function(e) {
      var el = e.target, tb = el && el.closest && el.closest('table.data tbody');
      if (!tb || !el.matches('input, select')) return;
      var txt = (e.clipboardData || window.clipboardData).getData('text');
      if (!txt || !/[\t\n]/.test(txt.replace(/\r?\n$/, ''))) return; // una sola celda: pegado normal
      e.preventDefault();
      var filas = txt.replace(/\r/g, '').replace(/\n$/, '').split('\n').map(function(l) { return l.split('\t'); });
      var campos = function(tr) { return Array.prototype.filter.call(tr.querySelectorAll('input, select'), function(x) { return x.type !== 'color' && x.type !== 'hidden'; }); };
      var tr0 = el.closest('tr'), fila0 = Array.prototype.indexOf.call(tb.rows, tr0), col0 = campos(tr0).indexOf(el);
      var id = tb.id, fn = tb.getAttribute('data-anadir');
      // Añade filas si hacen falta (cada alta re-pinta la tabla).
      var guard = 0;
      while (fn && typeof window[fn] === 'function' && document.getElementById(id).rows.length < fila0 + filas.length && guard++ < 500) window[fn]();
      tb = document.getElementById(id);
      var n = 0;
      filas.forEach(function(vals, r) {
        var tr = tb.rows[fila0 + r]; if (!tr) return;
        var cs = campos(tr);
        vals.forEach(function(v, c) {
          var x = cs[col0 + c]; if (!x) return;
          v = String(v).trim();
          if (x.type === 'checkbox') { x.checked = /^(s[ií]|x|1|true|verdadero)$/i.test(v); x.dispatchEvent(new Event('change', { bubbles: true })); }
          else if (x.tagName === 'SELECT') {
            var op = Array.prototype.find.call(x.options, function(o) { return o.value === v || o.text.trim().toLowerCase() === v.toLowerCase(); });
            if (op) { x.value = op.value; x.dispatchEvent(new Event('change', { bubbles: true })); }
          } else { x.value = v; x.dispatchEvent(new Event('input', { bubbles: true })); }
          n++;
        });
      });
      aviso('Pegadas ' + n + ' celdas');
    });

    // Cabecera de cada vista: el título ya está en la pestaña, así que se quita
    // y la explicación pasa a un icono «i» desplegable (gana espacio vertical).
    function _cabecerasCompactas() {
      document.querySelectorAll('.view > .page-head:first-child').forEach(function(ph) {
        var h = ph.querySelector('h2'), p = ph.querySelector('p');
        if (h) h.remove();
        if (!p) return;
        var w = document.createElement('span');
        w.className = 'info-wrap ph-info';
        w.innerHTML = '<button type="button" class="info-btn" aria-label="Qué es esta sección" title="Qué es esta sección" onclick="toggleInfo(this, event)">i</button><span class="info-pop" hidden></span>';
        w.lastChild.innerHTML = p.innerHTML;
        // Si le sigue una barra de herramientas, el icono va al principio de
        // ella y la cabecera desaparece; si no, queda en una línea mínima.
        var sig = ph.nextElementSibling;
        if (!ph.querySelector('.segmented, .sb-toolbar, button, select') && sig && /toolbar/.test(sig.className)) {
          sig.insertBefore(w, sig.firstChild); ph.remove(); return;
        }
        p.replaceWith(w);
        ph.classList.add('ph-compacta');
      });
    }

    // Icono «i» con explicación desplegable (no ocupa sitio en la maquetación).
    function toggleInfo(btn, ev) {
      if (ev) ev.stopPropagation();
      var pop = btn.nextElementSibling, abrir = pop.hidden;
      document.querySelectorAll('.info-pop').forEach(function(p) { p.hidden = true; });
      pop.hidden = !abrir;
    }
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.info-pop')) document.querySelectorAll('.info-pop').forEach(function(p) { p.hidden = true; });
    });

    // Aviso breve (toast) en la esquina inferior; sustituye a alert().
    function aviso(msg, tipo) {
      var box = document.getElementById('toasts');
      if (!box) { box = document.createElement('div'); box.id = 'toasts'; document.body.appendChild(box); }
      var t = document.createElement('div');
      t.className = 'toast ' + (tipo || 'ok');
      t.textContent = msg;
      box.appendChild(t);
      setTimeout(function() { t.classList.add('fuera'); setTimeout(function() { t.remove(); }, 300); }, tipo === 'err' ? 6000 : 2800);
    }

    // Modal de confirmación
    var _confirmCallback = null;
    function confirmar(mensaje, onAceptar, opciones) {
      opciones = opciones || {};
      document.getElementById('modal-confirm-title').textContent = opciones.titulo || 'Confirmar';
      document.getElementById('modal-confirm-msg').textContent = mensaje;
      const ok = document.getElementById('modal-confirm-ok');
      ok.textContent = opciones.aceptar || 'Aceptar';
      ok.className = opciones.peligro ? 'danger' : 'primary';
      document.getElementById('modal-confirm').classList.add('show');
      _confirmCallback = onAceptar;
    }
    function modalConfirmResp(ok) {
      document.getElementById('modal-confirm').classList.remove('show');
      const cb = _confirmCallback; _confirmCallback = null;
      if (ok && cb) cb();
    }
  </script>
</body>
</html>

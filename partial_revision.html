<div class="page-head">
  <h2>Revisión</h2>
  <p>Comprueba la integridad del horario: referencias rotas, docentes con huecos, solapes, grupos sin tutor, tramos o semanas solapados, datos incompletos, duplicados y más. Resuelve cada problema desde aquí o salta al editor correspondiente.</p>
</div>

<div class="toolbar">
  <button class="secondary" onclick="renderProblemas()">Volver a analizar</button>
  <span id="rev-resumen" class="hint"></span>
</div>

<div id="revp-filtros" class="rev-filtros"></div>
<div id="revp-body"></div>

<script>
  var REV_CAT = null;
  var REV_DATA = null;           // últimos grupos de problemas analizados
  var REV_OCULTOS = _revCargarOcultos();  // tipos de problema que el usuario oculta

  function _revCargarOcultos() {
    try { return JSON.parse(localStorage.getItem('rev_ocultos') || '{}') || {}; } catch (e) { return {}; }
  }
  function _revGuardarOcultos() {
    try { localStorage.setItem('rev_ocultos', JSON.stringify(REV_OCULTOS)); } catch (e) {}
  }

  function renderProblemas() {
    const cont = document.getElementById('revp-body');
    cont.innerHTML = '<p class="hint"><span class="spinner"></span> Analizando…</p>';
    document.getElementById('revp-filtros').innerHTML = '';
    document.getElementById('rev-resumen').textContent = '';
    google.script.run
      .withSuccessHandler(_pintarRevision)
      .withFailureHandler(function(err){ cont.innerHTML = '<div class="result err">✗ ' + (err.message || err) + '</div>'; })
      .revisarProblemas();
  }

  function _pintarRevision(res) {
    REV_CAT = res.catalogo || {};
    REV_DATA = res;
    _revRepintar();
  }

  // Repinta filtros + cuerpo con los tipos activos (sin volver a llamar al servidor).
  function _revRepintar() {
    const cont = document.getElementById('revp-body');
    const res = REV_DATA || { grupos: [] };
    const grupos = res.grupos || [];

    if (!grupos.length) {
      document.getElementById('revp-filtros').innerHTML = '';
      document.getElementById('rev-resumen').textContent = '';
      cont.innerHTML = '<div class="result ok" style="margin-top:0;">✓ Todo correcto. No se han detectado problemas en el horario.</div>';
      return;
    }

    // Barra de filtros: un chip por tipo detectado.
    document.getElementById('revp-filtros').innerHTML = _revFiltrosHTML(grupos);

    const visibles = grupos.filter(function(gp){ return !REV_OCULTOS[gp.tipo]; });
    let errVis = 0, avVis = 0;
    visibles.forEach(function(gp){ if (gp.gravedad === 'error') errVis += gp.items.length; else avVis += gp.items.length; });
    const r = res.resumen || {};
    var resumen = (r.errores || 0) + ' error(es), ' + (r.avisos || 0) + ' aviso(s)';
    const ocultosN = grupos.length - visibles.length;
    if (ocultosN > 0) resumen += ' · mostrando ' + errVis + '+' + avVis + ' (' + ocultosN + ' tipo(s) oculto(s))';
    document.getElementById('rev-resumen').textContent = resumen;

    if (!visibles.length) {
      cont.innerHTML = '<div class="result info" style="margin-top:0;">Todos los tipos de problema están ocultos. Activa alguno en los filtros de arriba.</div>';
      return;
    }
    cont.innerHTML = visibles.map(_pintarGrupo).join('');
  }

  function _revFiltrosHTML(grupos) {
    var chips = grupos.map(function(gp){
      var on = !REV_OCULTOS[gp.tipo];
      return '<button type="button" class="rev-chip-f' + (on ? ' on' : ' off') + ' ' + (gp.gravedad === 'error' ? 'g-error' : 'g-aviso') + '" ' +
        'onclick="revToggleTipo(\'' + gp.tipo + '\')" title="' + (on ? 'Ocultar' : 'Mostrar') + '">' +
        (on ? '● ' : '○ ') + _esc(gp.titulo) + ' <span class="n">' + gp.items.length + '</span></button>';
    }).join('');
    return '<span class="rev-filtros-lbl">Mostrar:</span> ' + chips +
      ' <button type="button" class="rev-chip-f todos" onclick="revMostrarTodos()">Todos</button>';
  }

  function revToggleTipo(tipo) {
    if (REV_OCULTOS[tipo]) delete REV_OCULTOS[tipo]; else REV_OCULTOS[tipo] = true;
    _revGuardarOcultos();
    _revRepintar();
  }
  function revMostrarTodos() {
    REV_OCULTOS = {};
    _revGuardarOcultos();
    _revRepintar();
  }

  function _pintarGrupo(gp) {
    var badge = '<span class="badge ' + (gp.gravedad === 'error' ? 'vacio' : 'incompleto') + '">' + (gp.gravedad === 'error' ? 'error' : 'aviso') + '</span>';
    var items = gp.items.map(function(it){ return _pintarItem(gp.tipo, it); }).join('');
    return '<div class="rev-group">' +
      '<div class="rev-group-head"><h3>' + _esc(gp.titulo) + ' <span class="rev-count">' + gp.items.length + '</span></h3>' + badge + '</div>' +
      '<p class="hint" style="margin-top:0;">' + _esc(gp.descripcion) + '</p>' +
      '<div class="rev-items">' + items + '</div>' +
    '</div>';
  }

  function _pintarItem(tipo, it) {
    if (tipo === 'ref') return _itemRef(it);
    if (tipo === 'incompleto') return _itemIncompleto(it);
    if (tipo === 'solape') return _itemSolape(it);
    if (tipo === 'sin_tutor') return _itemSinTutor(it);
    return _itemGenerico(it);
  }
  // Render genérico para el resto de chequeos: un texto y una lista de acciones
  // (enlace a una pestaña, editar el horario de un docente, o borrar una ocupación).
  function _itemGenerico(it) {
    var acc = (it.acc || []).map(function(a){
      if (a.t === 'borrar') return _btn(a.label || 'Borrar ocupación', "revBorrar('" + a.ocup_id + "')", 'danger');
      if (a.t === 'horario') return _btn(a.label || 'Editar horario', "abrirHorarioDocente('" + a.docente_id + "', true)", 'secondary');
      if (a.t === 'tab') return _btn(a.label, "irConfig('" + a.tab + "')", 'secondary');
      return '';
    }).join('');
    return _revRow(_esc(it.texto), acc);
  }

  function _revRow(texto, acciones) {
    return '<div class="rev-item"><div class="rev-item-txt">' + texto + '</div><div class="rev-item-acc">' + acciones + '</div></div>';
  }
  function _btn(txt, fn, cls) { return '<button class="' + (cls || 'secondary') + ' btn-sm" onclick="' + fn + '">' + txt + '</button>'; }

  function _itemRef(it) {
    var txt = '<b>' + _esc(it.docente) + '</b> · ' + _esc(it.dia || '') + ' ' + _esc(it.tramo || '') +
      ' — <span class="rev-bad">' + _esc(it.campoLabel) + ' inexistente</span> <code>' + _esc(it.valor) + '</code>';
    var acc = '';
    if (it.reasignable) acc += _revSelectReasignar(it);
    acc += _btn('Borrar ocupación', "revBorrar('" + it.ocup_id + "')", 'danger');
    return _revRow(txt, acc);
  }
  function _revSelectReasignar(it) {
    var opts = _revOpcionesCampo(it.campo);
    var sel = '<select class="btn-sm" onchange="revReasignar(\'' + it.ocup_id + '\',\'' + it.campo + '\',this.value)">' +
      '<option value="">Reasignar ' + _esc(it.campoLabel.toLowerCase()) + '…</option>' + opts + '</select>';
    return sel;
  }
  function _revOpcionesCampo(campo) {
    var arr = [], label = function(x){ return x.nombre; };
    if (campo === 'docente_id') arr = REV_CAT.docentes || [];
    else if (campo === 'materia_id') arr = REV_CAT.materias || [];
    else if (campo === 'rol_loc_id' || campo === 'rol_especial_id') arr = REV_CAT.roles || [];
    else if (campo === 'tramo_id') { arr = REV_CAT.tramos || []; label = function(t){ return (t.etiqueta || ('T' + t.orden)) + ' ' + (t.horas || ''); }; }
    return arr.map(function(x){ return '<option value="' + x.id + '">' + _esc(label(x)) + '</option>'; }).join('');
  }

  function _itemIncompleto(it) {
    var txt = '<b>' + _esc(it.docente) + '</b> — le faltan <b>' + it.huecos + '</b> hueco(s) ' +
      '<span class="rev-dim">(' + it.ocupados + '/' + it.esperado + ' tramos lectivos)</span>';
    var acc = _btn('Marcar parcial', "revParcial('" + it.docente_id + "')", 'secondary') +
      _btn('Editar horario', "abrirHorarioDocente('" + it.docente_id + "', true)", 'secondary');
    return _revRow(txt, acc);
  }

  function _itemSolape(it) {
    var txt = '<b>' + _esc(it.docente) + '</b> · ' + _esc(it.dia) + ' ' + _esc(it.tramo) +
      ' — ' + it.detalles.map(function(d){ return '<span class="rev-chip">' + _esc(d) + '</span>'; }).join(' + ');
    var acc = _btn('Editar horario', "abrirHorarioDocente('" + it.docente_id + "', true)", 'secondary');
    return _revRow(txt, acc);
  }

  function _itemSinTutor(it) {
    var txt = '<b>' + _esc(it.grupo) + '</b> — sin tutor/a asignado';
    var acc = _btn('Asignar tutor', "irConfig('grupos')", 'secondary');
    return _revRow(txt, acc);
  }

  // ---- Acciones ----
  function revReasignar(ocupId, campo, valor) {
    if (!valor) return;
    google.script.run.withSuccessHandler(renderProblemas).withFailureHandler(mostrarErrorGenerico)
      .reasignarOcupacion(ocupId, campo, valor);
  }
  function revBorrar(ocupId) {
    confirmar('¿Borrar esta ocupación? No se puede deshacer.', function() {
      google.script.run.withSuccessHandler(renderProblemas).withFailureHandler(mostrarErrorGenerico)
        .eliminarOcupacion(ocupId);
    }, { peligro: true, aceptar: 'Borrar', titulo: 'Borrar ocupación' });
  }
  function revParcial(docenteId) {
    google.script.run.withSuccessHandler(function(){ refrescarEstado(); renderProblemas(); }).withFailureHandler(mostrarErrorGenerico)
      .marcarDocenteParcial(docenteId, true);
  }
</script>
